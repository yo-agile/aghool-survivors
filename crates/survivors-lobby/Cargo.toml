[package]
name = "survivors-lobby"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Co-op matchmaking + web-save server for Warcraft Survivors: public/private lobbies, join codes, ready-up, match handoff, and the web build's character-progress saves (the desktop build saves to its own machine instead). Carries no game data and no player credentials by default, so unlike wenilla-host it's meant to run on the open internet."

[lints]
workspace = true

[lib]
name = "survivors_lobby"
path = "src/lib.rs"

[[bin]]
name = "survivors-lobby"
path = "src/main.rs"
test = false

[dependencies]
survivors-lobby-protocol = { path = "../survivors-lobby-protocol" }
anyhow.workspace = true
clap.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
# Splits `axum::extract::ws::WebSocket` into independent read/write halves, same reason
# wenilla-host takes it: the send side (broadcast → socket) and the recv side (socket →
# handler) run as two concurrent tasks.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
# The web client is normally served from a different origin than this server (it's a separate
# process, likely a separate (sub)domain even on the same VPS); without this, browsers refuse
# the fetch/WebSocket entirely.
tower-http = { version = "0.7", features = ["cors", "trace"] }

[dev-dependencies]
# The integration test drives the real router over a real socket (WebSocket framing is fiddly to
# hand-roll) and answers REST through `ServiceExt::oneshot`, no socket needed.
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
